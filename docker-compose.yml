services:
  postgres:
    image: postgres:16-alpine
    container_name: remixdock_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: remixdock_user
      POSTGRES_PASSWORD: remixdock_password
      POSTGRES_DB: remixdock_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remixdock_user -d remixdock_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
